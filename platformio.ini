
[platformio]
name = AnimatedPixelClock
description = Animated pixel clock + PC stats monitor - ESP32-S3 + 128x64 HUB75 RGB matrix
default_envs = matrix-wf2

; ================= HUB75 RGB matrix =================
[env:matrix-base]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200

extra_scripts =
    pre:tools/web_assets_build.py
    pre:tools/patch_hub75.py
    pre:tools/patch_nimble.py

board_build.filesystem = littlefs

lib_deps =
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit GFX Library@^1.12.4
    bblanchon/ArduinoJson@^7.4.2
    ricmoo/QRCode@^0.0.1
    jnthas/Improv WiFi Library@^0.0.2
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14

; ================= HUIDU HD-WF2 =================
; ESP32-S3 + HUB75 output 75EX1
; Flash and PSRAM are intentionally not assumed.

; [env:matrix-wf2]
; extends = env:matrix-base
; board = esp32-s3-devkitc-1

; build_flags =
;     ${env:matrix-base.build_flags}

;     -DHUB75_PINS_CUSTOM
;     -DHUB75_PIN_R1=2
;     -DHUB75_PIN_G1=6
;     -DHUB75_PIN_B1=10
;     -DHUB75_PIN_R2=3
;     -DHUB75_PIN_G2=7
;     -DHUB75_PIN_B2=11
;     -DHUB75_PIN_A=39
;     -DHUB75_PIN_B=38
;     -DHUB75_PIN_C=37
;     -DHUB75_PIN_D=36
;     -DHUB75_PIN_E=21
;     -DHUB75_PIN_LAT=33
;     -DHUB75_PIN_OE=35
;     -DHUB75_PIN_CLK=34


[env:matrix-wf2]
extends = env:matrix-base
board = esp32-s3-devkitc-1

build_flags =
    ${env:matrix-base.build_flags}

    -DHUB75_PINS_CUSTOM
    -DHUB75_PIN_R1=2
    -DHUB75_PIN_G1=6
    -DHUB75_PIN_B1=10
    -DHUB75_PIN_R2=3
    -DHUB75_PIN_G2=7
    -DHUB75_PIN_B2=11
    -DHUB75_PIN_A=39
    -DHUB75_PIN_B=38
    -DHUB75_PIN_C=37
    -DHUB75_PIN_D=36
    -DHUB75_PIN_E=21
    -DHUB75_PIN_LAT=33
    -DHUB75_PIN_OE=35
    -DHUB75_PIN_CLK=34

board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

board_build.flash_size = 8MB
board_build.partitions = wf2_8MB.csv
board_build.filesystem = littlefs
; ================= Waveshare S3-Zero =================
[env:matrix-s3]
extends = env:matrix-base
board = esp32-s3-devkitm-1

build_flags =
    ${env:matrix-base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

; ================= ESP32-S3-WROOM =================
[env:matrix-s3-wroom]
extends = env:matrix-base
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi

build_flags =
    ${env:matrix-base.build_flags}
    -DBOARD_HAS_PSRAM

upload_port = COM9
monitor_port = COM9

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ================= WAVESHARE RGB MATRIX =================
[env:matrix-waveshare]
extends = env:matrix-base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi

build_flags =
    ${env:matrix-base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DHUB75_PINS_CUSTOM
    -DHUB75_PIN_R1=4
    -DHUB75_PIN_G1=5
    -DHUB75_PIN_B1=6
    -DHUB75_PIN_R2=7
    -DHUB75_PIN_G2=15
    -DHUB75_PIN_B2=16
    -DHUB75_PIN_A=18
    -DHUB75_PIN_B=8
    -DHUB75_PIN_C=3
    -DHUB75_PIN_D=42
    -DHUB75_PIN_E=9
    -DHUB75_PIN_LAT=40
    -DHUB75_PIN_OE=2
    -DHUB75_PIN_CLK=41
    -DLED_STRIP_DEFAULT_PIN=46

board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.flash_size = 32MB
board_build.partitions = large_littlefs_32MB.csv

; ================= GAME VARIANTS =================
[game]
build_flags =
    -DGAMEPAD_ENABLED=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

[env:matrix-s3-games]
extends = env:matrix-s3
build_flags = ${env:matrix-s3.build_flags} ${game.build_flags}
lib_deps = ${env:matrix-base.lib_deps} ${game.lib_deps}

[env:matrix-s3-wroom-games]
extends = env:matrix-s3-wroom
build_flags = ${env:matrix-s3-wroom.build_flags} ${game.build_flags}
lib_deps = ${env:matrix-base.lib_deps} ${game.lib_deps}

[env:matrix-waveshare-games]
extends = env:matrix-waveshare
build_flags = ${env:matrix-waveshare.build_flags} ${game.build_flags}
lib_deps = ${env:matrix-base.lib_deps} ${game.lib_deps}

; ================= BRINGUP TESTS =================
[env:matrix-wf2-bringup]
extends = env:matrix-wf2
build_src_filter = -&lt;*&gt; +&lt;../bringup/&gt;

[env:matrix-s3-bringup]
extends = env:matrix-s3
build_src_filter = -&lt;*&gt; +&lt;../bringup/&gt;

[env:matrix-wroom-bringup]
extends = env:matrix-s3-wroom
build_src_filter = -&lt;*&gt; +&lt;../bringup/&gt;

[env:matrix-waveshare-bringup]
extends = env:matrix-waveshare
build_src_filter = -&lt;*&gt; +&lt;../bringup/&gt;
